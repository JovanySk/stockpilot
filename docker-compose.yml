services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:-StockPilot#Dev2026}
      MSSQL_MEMORY_LIMIT_MB: "1536"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 12

  api:
    build: ./InventorySystem_ASPNETCore
    environment:
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=InventorySystemDb;User Id=sa;Password=${SA_PASSWORD:-StockPilot#Dev2026};TrustServerCertificate=True;MultipleActiveResultSets=true"
      ASPNETCORE_URLS: http://+:5116
    ports:
      - "5116:5116"
    depends_on:
      db:
        condition: service_healthy
