name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet test StockPilot.sln --logger "console;verbosity=normal"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build React client
        working-directory: InventorySystem_ASPNETCore/client
        run: npm ci && npm run build
